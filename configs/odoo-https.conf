# Fail2Ban filter for Odoo HTTPS login brute-force detection
# Deploy to: /etc/fail2ban/filter.d/odoo-https.conf
#
# Matches repeated POST /web/login attempts returning HTTP 200
# (Odoo returns 200 even on failed login — the failed attempt is detected by the POST itself)

[Definition]
failregex = ^<HOST> - - .* "POST /web/login HTTP.* 200
ignoreregex =
